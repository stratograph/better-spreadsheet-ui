<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sheet Cell Editor</title>
<link rel="stylesheet" href="css/styles.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<h1>Sheet Cell Editor</h1>

<div id="globalMessage"></div>

<div class="card" id="selectorCard" style="display:none;">
  <label for="rowSelect" id="rowSelectLabel">Row</label>
  <select id="rowSelect"></select>

  <label for="colSelect">Field</label>
  <select id="colSelect"></select>

  <div class="disabled-hint" id="metadataMissingNote" style="display:none;">No metadata found for this field.</div>

  <details class="accordion" id="metadataAccordion" style="display:none;">
    <summary>Description</summary>
    <div class="accordion-body" id="metadataDescription"></div>
  </details>
</div>

<div class="card" id="valueCard" style="display:none;">
  <div class="field-label">
    <label for="valueBox" style="margin:0;">Value</label>
    <span class="field-status" id="valueStatus"></span>
  </div>
  <textarea id="valueBox" rows="1" placeholder="Cell contents"></textarea>
  <select id="valueSelect" style="display:none;"></select>
  <div class="formula-note" id="valueFormulaNote" style="display:none;">Cannot edit formulas here</div>
</div>

<div class="card" id="justCard" style="display:none;">
  <div class="field-label">
    <label for="justBox" style="margin:0;">Justification</label>
    <span class="field-status" id="justStatus"></span>
  </div>
  <textarea id="justBox" placeholder="Cell contents"></textarea>
  <div class="formula-note" id="justFormulaNote" style="display:none;">Cannot edit formulas here</div>
  <div class="row" style="margin-top: 8px;">
    <button id="addClipboardBtn" class="secondary" style="display:none;">Add clipboard contents</button>
  </div>
</div>

<div class="disabled-hint" id="emptyHint">
  Fill in Settings, then sign in to load the sheet.
</div>

<div id="footerSpacer"></div>

<div id="footerBar">
  <div class="card">
    <div class="row" style="align-items: center;">
      <div id="authStatus">Not signed in</div>
    </div>
    <div class="row" style="margin-top: 10px;">
      <button id="reloadBtn" class="secondary" style="display:none;">Reload sheet structure</button>
    </div>
    <div class="row" style="margin-top: 10px;">
      <button id="signInBtn">Sign in with Google</button>
      <button id="signOutBtn" class="secondary" style="display:none;">Sign out</button>
    </div>
  </div>

  <details class="card" id="settingsDetails">
    <summary>Settings</summary>

    <label for="clientId">Google OAuth Client ID</label>
    <input type="text" id="clientId" placeholder="xxxxx.apps.googleusercontent.com" autocomplete="off" />

    <label for="sheetId">Spreadsheet ID</label>
    <input type="text" id="sheetId" placeholder="from the sheet's URL" autocomplete="off" />

    <label for="valueSheetName">Value tab name</label>
    <input type="text" id="valueSheetName" placeholder="Value" autocomplete="off" />

    <label for="justSheetName">Justification tab name</label>
    <input type="text" id="justSheetName" placeholder="Justification" autocomplete="off" />

    <label for="metadataSheetName">Metadata tab name</label>
    <input type="text" id="metadataSheetName" placeholder="Metadata" autocomplete="off" />

    <div class="row" style="margin-top: 12px;">
      <button id="saveSettingsBtn">Save Settings</button>
    </div>
  </details>
</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
